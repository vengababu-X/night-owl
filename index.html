<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night Owl | Kavali Midnight Delivery</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --accent: #f39c12;
            --accent-hover: #e67e22;
            --text: #ffffff;
            --text-muted: #b2b2b2;
            --green: #2ecc71;
            --border: #333333;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 440px; margin: auto; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { color: var(--accent); margin: 0 0 5px 0; font-size: 28px; }
        .subtitle { color: var(--text-muted); font-size: 13px; }
        
        .section-title { color: var(--accent); font-size: 16px; margin: 25px 0 10px 0; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        
        #menuContainer { min-height: 100px; }
        .menu-item { background: var(--card-bg); padding: 14px; margin: 12px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); transition: border-color 0.2s; }
        .menu-item:hover { border-color: var(--accent); }
        .item-details h4 { margin: 0 0 4px 0; font-size: 16px; }
        .item-details p { margin: 0 0 6px 0; color: var(--text-muted); font-size: 12px; }
        .price { color: var(--green); font-weight: bold; font-size: 15px; }
        
        input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; }
        
        .form-group { margin: 12px 0; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); box-sizing: border-box; font-size: 14px; }
        input:focus { outline: none; border-color: var(--accent); }
        
        .cart-summary { background: #181818; border: 1px dashed var(--accent); padding: 15px; border-radius: 10px; margin-top: 25px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: bold; }
        .total-price { color: var(--green); font-size: 20px; }
        
        button { width: 100%; padding: 15px; margin-top: 15px; border-radius: 8px; border: none; background: var(--accent); color: #000; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        
        .footer-note { text-align: center; color: var(--text-muted); font-size: 11px; margin-top: 20px; }
        .loading { text-align: center; color: var(--text-muted); padding: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>Night Owl 🦉</h1>
        <div class="subtitle">Kavali's Ultimate Midnight Cravings Delivery (10 PM - 4 AM)</div>
    </header>

    <div class="section-title">Menu Selection</div>
    <div id="menuContainer">
        <div class="loading">Loading live menu from sheet...</div>
    </div>

    <div class="section-title">Delivery Details</div>
    <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">
    </div>
    
    <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="phone" placeholder="WhatsApp / Mobile number">
    </div>
    
    <div class="form-group">
        <label>Hostel / Location Details</label>
        <input type="text" id="room" placeholder="Hostel Block & Room No">
    </div>

    <div class="cart-summary">
        <span>Total Amount:</span>
        <span class="total-price" id="totalDisplay">₹0</span>
    </div>
    
    <button id="submitBtn" onclick="submitOrder()">Place Order Now 🚀</button>

    <div class="footer-note">Payment via UPI / Cash on Delivery upon arrival.</div>

    <script>
        // Your Version 4 Web App URL
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyJoqcRWuV7x2kOBtsWHh4uKykBRWoyOfi9hcla9mx-wYCnXhdGXK-v7Fe2CnyDiY_i/exec";

        // Fetch menu dynamically from Google Sheet on load
        window.onload = function() {
            fetch(WEB_APP_URL + "?action=getMenu")
                .then(res => res.json())
                .then(items => {
                    let container = document.getElementById('menuContainer');
                    container.innerHTML = "";
                    if(items.length === 0) {
                        container.innerHTML = "<div class='loading'>No menu items found. Add items to your 'Menu' tab in Google Sheets.</div>";
                        return;
                    }
                    items.forEach(item => {
                        let div = document.createElement('div');
                        div.className = "menu-item";
                        div.innerHTML = `
                            <div class="item-details">
                                <h4>${item.name}</h4>
                                <p>${item.description}</p>
                                <span class="price">₹${item.price}</span>
                            </div>
                            <input type="checkbox" class="order-item" data-name="${item.name}" data-price="${item.price}" onchange="calculateTotal()">
                        `;
                        container.appendChild(div);
                    });
                })
                .catch(err => {
                    document.getElementById('menuContainer').innerHTML = "<div class='loading' style='color:#e74c3c;'>Failed to load menu. Check your deployment URL.</div>";
                });
        };

        function calculateTotal() {
            let total = 0;
            document.querySelectorAll('.order-item:checked').forEach(el => {
                total += parseInt(el.getAttribute('data-price'));
            });
            document.getElementById('totalDisplay').innerText = "₹" + total;
        }

        function submitOrder() {
            let name = document.getElementById('name').value.trim();
            let phone = document.getElementById('phone').value.trim();
            let room = document.getElementById('room').value.trim();
            
            let checkedItems = [];
            let totalAmount = 0;
            
            document.querySelectorAll('.order-item:checked').forEach(el => {
                let nameStr = el.getAttribute('data-name');
                let priceStr = el.getAttribute('data-price');
                checkedItems.push(nameStr + " (₹" + priceStr + ")");
                totalAmount += parseInt(priceStr);
            });

            if(!name || !phone || !room) {
                alert("Please fill in your Name, Phone Number, and Hostel Room!");
                return;
            }
            if(checkedItems.length === 0) {
                alert("Please select at least one food item from the menu!");
                return;
            }

            let orderData = {
                name: name,
                phone: phone,
                room: room,
                items: checkedItems.join(', ') + " [Total: ₹" + totalAmount + "]"
            };

            let btn = document.getElementById('submitBtn');
            btn.innerText = "Submitting Order...";
            btn.disabled = true;

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(orderData)
            })
            .then(res => res.json())
            .then(data => {
                alert("🎉 Order Placed Successfully! We are rushing to your room.");
                location.reload();
            })
            .catch(err => {
                alert("🎉 Order Placed Successfully! We received your request.");
                location.reload();
            });
        }
    </script>
</body>
</html>
