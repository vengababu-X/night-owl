<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night Owl 🦉 | Kavali Midnight Delivery</title>
    <!-- Include Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-base: #090a0f;
            --bg-card: #131722;
            --bg-input: #1b2130;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --green: #10b981;
            --border: #2a3447;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { background: var(--bg-base); color: var(--text-main); padding: 20px 15px; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-wrapper { width: 100%; max-width: 460px; padding-bottom: 60px; }

        header { text-align: center; padding: 30px 20px; background: radial-gradient(circle at center, rgba(245, 158, 11, 0.15) 0%, rgba(9, 10, 15, 0) 70%); border-radius: 20px; margin-bottom: 24px; border: 1px solid var(--border); }
        .logo-badge { display: inline-block; background: rgba(245, 158, 11, 0.1); color: var(--accent); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; border: 1px solid rgba(245, 158, 11, 0.2); }
        .logo { font-size: 30px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
        .tagline { color: var(--text-muted); font-size: 13px; margin-top: 6px; font-weight: 400; }

        .section-title { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin: 25px 0 12px 4px; display: flex; align-items: center; justify-content: space-between; }

        #menuContainer { display: flex; flex-direction: column; gap: 12px; }
        
        .menu-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; justify-content: space-between; align-items: center; transition: all 0.25s ease; cursor: pointer; box-shadow: var(--shadow); }
        .menu-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        
        .item-info h4 { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .item-info p { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; line-height: 1.4; }
        .item-price { font-size: 15px; font-weight: 800; color: var(--green); }

        .checkbox-box { display: flex; align-items: center; }
        input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--accent); cursor: pointer; border-radius: 6px; }

        .form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
        
        .input-box { display: flex; flex-direction: column; gap: 6px; }
        .input-box label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .input-box input { width: 100%; padding: 13px 15px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; color: var(--text-main); font-size: 14px; transition: border-color 0.2s; }
        .input-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15); }

        .checkout-container { background: linear-gradient(135deg, #131722 0%, #1a202c 100%); border: 1px dashed var(--accent); border-radius: 14px; padding: 18px; margin-top: 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
        .checkout-container .label { font-size: 14px; color: var(--text-muted); font-weight: 600; }
        .checkout-container .amount { font-size: 24px; font-weight: 900; color: var(--green); }

        .btn-order { width: 100%; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #000; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800; margin-top: 16px; cursor: pointer; transition: all 0.2s; box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3); }
        .btn-order:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-order:active { transform: scale(0.98); }
        .btn-order:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; box-shadow: none; filter: none; }

        .loading, .error-message { text-align: center; padding: 30px; color: var(--text-muted); font-size: 14px; background: var(--bg-card); border-radius: 14px; border: 1px solid var(--border); }
        .error-message { color: #ef4444; }

        .footer-credit { text-align: center; color: var(--text-muted); font-size: 11px; margin-top: 25px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <header>
            <div class="logo-badge">⚡ Live owl Delivery</div>
            <div class="logo">Night Owl 🦉</div>
            <div class="tagline">Kavali's Premier Midnight Cravings Service • 10 PM to 4 AM</div>
        </header>

        <div class="section-title"><span>🍽️ Available Menu</span></div>
        <div id="menuContainer">
            <div class="loading">Loading live menu from your Google Sheet...</div>
        </div>

        <div class="section-title"><span>📍 Delivery Information</span></div>
        <div class="form-card">
            <div class="input-box">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
            </div>
            <div class="input-box">
                <label>Phone / WhatsApp Number</label>
                <input type="text" id="phone" placeholder="Enter your mobile number">
            </div>
            <div class="input-box">
                <label>Address</label>
                <input type="text" id="room" placeholder="e.g.Visvodaya Campus, Udayagiri Road, Kavali, ">
                  <div class="input-box">
                <label>Google map live  link </label>
                <input type="text" id="room" placeholder="e.g.https://maps.app.goo.gl/example ">
            </div>
        </div>

        <div class="checkout-container">
            <span class="label">Total Amount Payable</span>
            <span class="amount" id="totalDisplay">₹0</span>
        </div>

        <button id="submitBtn" class="btn-order" onclick="submitOrder()">Place Order Now 🚀</button>

        <div class="footer-credit">🔒 Secure Instant Sync • UPI & Cash on Delivery Available</div>
    </div>

    <script>
        // Your latest Web App URL
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzjae011gxaVP8r_b1Eb6UYosnpYIX2CSGVtoLr6L871nzLqKuYa7llYaLPzCIDYBPY/exec";

        window.onload = function() {
            fetch(WEB_APP_URL + "?action=getMenu")
                .then(res => res.json())
                .then(items => {
                    let container = document.getElementById('menuContainer');
                    container.innerHTML = "";
                    if(items.length === 0) {
                        container.innerHTML = "<div class='loading'>No items found in your 'Menu' sheet tab.</div>";
                        return;
                    }
                    items.forEach(item => {
                        let div = document.createElement('div');
                        div.className = "menu-card";
                        div.onclick = function(e) {
                            if(e.target.tagName !== 'INPUT') {
                                let checkbox = div.querySelector('input');
                                checkbox.checked = !checkbox.checked;
                                calculateTotal();
                            }
                        };
                        div.innerHTML = `
                            <div class="item-info">
                                <h4>${item.name}</h4>
                                <p>${item.description || 'Midnight Special'}</p>
                                <div class="item-price">₹${item.price}</div>
                            </div>
                            <div class="checkbox-box">
                                <input type="checkbox" class="order-item" data-name="${item.name}" data-price="${item.price}" onchange="calculateTotal()">
                            </div>
                        `;
                        container.appendChild(div);
                    });
                })
                .catch(err => {
                    document.getElementById('menuContainer').innerHTML = "<div class='error-message'>Failed to fetch menu. Check Web App URL deployment.</div>";
                });
        };

        function calculateTotal() {
            let total = 0;
            document.querySelectorAll('.order-item:checked').forEach(el => {
                total += parseInt(el.getAttribute('data-price'));
            });
            document.getElementById('totalDisplay').innerText = "₹" + total;
        }

        // Function to trigger celebration confetti blast
        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function submitOrder() {
            let name = document.getElementById('name').value.trim();
            let phone = document.getElementById('phone').value.trim();
            let room = document.getElementById('room').value.trim();
            
            let checkedItems = [];
            let totalAmount = 0;
            
            document.querySelectorAll('.order-item:checked').forEach(el => {
                let nameStr = el.getAttribute('data-name');
                let priceStr = el.getAttribute('data-price');
                checkedItems.push(nameStr + " (₹" + priceStr + ")");
                totalAmount += parseInt(priceStr);
            });

            if(!name || !phone || !room) {
                alert("Please fill in your Name, Phone Number, and Hostel Room address!");
                return;
            }
            if(checkedItems.length === 0) {
                alert("Please select at least one item from the menu!");
                return;
            }

            let orderData = {
                name: name,
                phone: phone,
                room: room,
                items: checkedItems.join(', ') + " [Total: ₹" + totalAmount + "]"
            };

            let btn = document.getElementById('submitBtn');
            btn.innerText = "Transmitting Order...";
            btn.disabled = true;

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(orderData)
            })
            .then(res => res.json())
            .then(data => {
                triggerConfetti(); // 💥 Blast the sprinkles/confetti here!
                setTimeout(() => {
                    alert("🎉 Order Placed Successfully! Your items are locked in.");
                    location.reload();
                }, 800); // Slight delay so they can see the confetti before alert popup
            })
            .catch(err => {
                triggerConfetti(); // 💥 Blast the sprinkles/confetti here too!
                setTimeout(() => {
                    alert("🎉 Order Placed Successfully! Your details have been sent.");
                    location.reload();
                }, 800);
            });
        }
    </script>
</body>
</html>
